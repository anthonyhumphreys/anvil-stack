appId: dev.anthonyhumphreys.mezair
productName: Mezair
copyright: AnthonyHumphreys.dev

directories:
  output: dist
  buildResources: resources

afterPack: scripts/build-apple-speech-helper.mjs

fileAssociations:
  - ext: mezair-thread
    name: Mezair shared thread
    description: Pick up a shared Mezair conversation
    mimeType: application/vnd.mezair.thread+json
    role: Viewer

files:
  - 'out/**/*'
  - 'prompts/**/*'
  - 'scripts/chrome-mcp-server.mjs'
  - 'scripts/mezair-mcp-shim.mjs'
  - 'scripts/review-scenario-runner.mjs'
  - 'node_modules/**/*'
  - '!node_modules/**/test*'

extraResources:
  - from: resources/mezair.png
    to: mezair.png
  - from: resources/apple-foundation-models-helper.swift
    to: apple-foundation-models-helper.swift
  - from: resources/apple-foundation-models-helper-27.swift
    to: apple-foundation-models-helper-27.swift
  - from: resources/apple-foundation-models-helper-vision.swift
    to: apple-foundation-models-helper-vision.swift

mac:
  target: [dmg, zip]
  icon: resources/mezair.icns
  category: public.app-category.developer-tools
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSUserNotificationAlertStyle: alert
    NSMicrophoneUsageDescription: Mezair uses the microphone to turn speech into chat input.
    NSSpeechRecognitionUsageDescription: Mezair uses speech recognition to turn speech into chat input.

win:
  target: [nsis, portable]
  icon: resources/mezair.png

linux:
  target: [AppImage, deb, pacman]
  maintainer: Anthony Humphreys <contact@anthonyhumphreys.co.uk>
  icon: resources/mezair.png
  category: Development
