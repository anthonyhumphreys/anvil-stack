version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /mezair-app
      - /mezair-cloud
      - /mezair-registry
      - /mezair-website
      - /mezair-app/cloud/backend
      - /mezair-app/cloud/provisioner
      - /mezair-app/raycast/mezair
      - /mezair-app/video
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
