name: Anvil Desktop Updates Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-updates-cloudflare
  cancel-in-progress: false

defaults:
  run:
    working-directory: anvil-app

jobs:
  deploy:
    name: Deploy updates Worker
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-app/pnpm-lock.yaml

      - name: Validate Cloudflare deployment config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          missing=()
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || missing+=(CLOUDFLARE_DEPLOY_API_TOKEN)
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing Cloudflare deployment configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install Worker dependencies
        run: pnpm install --filter @anvilstack/desktop-updates-worker... --frozen-lockfile --ignore-scripts

      - name: Verify Worker
        run: |
          pnpm --dir updates-worker run types:check
          pnpm --dir updates-worker run typecheck
          pnpm --dir updates-worker run test
          pnpm --dir updates-worker run dry-run

      - name: Create R2 bucket when absent
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: |
          if ! pnpm --dir updates-worker exec wrangler r2 bucket info anvil-desktop-releases >/dev/null 2>&1; then
            pnpm --dir updates-worker exec wrangler r2 bucket create anvil-desktop-releases
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: pnpm --dir updates-worker run deploy
