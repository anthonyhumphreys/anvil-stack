name: Mezair Cloud CI

on:
  pull_request:
    paths:
      - ".github/workflows/cloud-ci.yml"
      - "mezair-cloud/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloud-ci.yml"
      - "mezair-cloud/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    working-directory: mezair-cloud

jobs:
  validate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mezair-cloud/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify packaged Notes golden path
        run: pnpm verify:notes-golden-path

      - name: Check formatting
        run: pnpm format:check
