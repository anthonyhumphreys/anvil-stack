name: Anvil candidate preview

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Full candidate head SHA, must match the current PR head
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    name: Preview (${{ matrix.platform }} ${{ matrix.arch }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    environment: anvil-staging
    env:
      ANVIL_DEPLOYMENT_ENV: staging
      ANVIL_STAGING_HOSTED_BACKEND_URL: ${{ vars.ANVIL_STAGING_HOSTED_BACKEND_URL }}
    steps:
      - name: Verify candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HEAD_SHA" == "$GITHUB_SHA" ]] || { echo 'Select the PR source branch as the workflow ref'; exit 1; }
          actual=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          [[ "$actual" == "$HEAD_SHA" ]] || { echo 'Candidate is stale'; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          test -s /etc/apt/sources.list.d/ubuntu.sources
          packaging_apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o APT::Get::List-Cleanup=0
          )
          sudo apt-get "${packaging_apt_options[@]}" update
          sudo apt-get "${packaging_apt_options[@]}" install --yes libarchive-tools
      - name: Install dependencies
        working-directory: anvil-app
        run: pnpm install --frozen-lockfile
      - name: Build isolated unsigned preview
        working-directory: anvil-app
        env:
          PR: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PREVIEW_PLATFORM: ${{ matrix.platform }}
          PREVIEW_ARCH: ${{ matrix.arch }}
        run: node scripts/build-candidate-preview.mjs "$PR" "$HEAD_SHA" "$PREVIEW_ARCH" "$PREVIEW_PLATFORM"
      - name: Retain build evidence and installable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-preview-pr-${{ inputs.pull_request }}-${{ inputs.head_sha }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            anvil-app/dist/previews/**/*.dmg
            anvil-app/dist/previews/**/*.zip
            anvil-app/dist/previews/**/*.AppImage
            anvil-app/dist/previews/**/*.deb
            anvil-app/dist/previews/**/*.pacman
            anvil-app/dist/previews/**/preview-manifest.json
          if-no-files-found: warn
          retention-days: 14
