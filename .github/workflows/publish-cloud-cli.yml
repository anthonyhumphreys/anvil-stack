name: Publish @anvilstack/cloud-cli to npm

on:
  push:
    tags:
      - "cloud-cli-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm stage publish with --dry-run instead of staging."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: anvil-cloud

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-cloud/pnpm-lock.yaml

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          expected_tag="cloud-cli-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @anvilstack/cloud-cli version ${package_version} (${expected_tag})." >&2
            exit 1
          fi

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm --filter @anvilstack/cloud-cli typecheck

      - name: Test
        run: pnpm --filter @anvilstack/cloud-cli test

      - name: Build
        run: pnpm --filter @anvilstack/cloud-cli build

      - name: Stage package on npm
        working-directory: anvil-cloud/packages/cli
        run: |
          extra_args=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            extra_args="--dry-run"
          fi
          npm stage publish --access public ${extra_args}
