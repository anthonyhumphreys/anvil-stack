name: Stage @anvilstack/registry-cli for npm approval

on:
  push:
    tags:
      - "registry-cli-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm stage publish with --dry-run instead of staging."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: anvil-registry

jobs:
  publish:
    name: Build, verify, and stage
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-registry/pnpm-lock.yaml

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          expected_tag="registry-cli-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match @anvilstack/registry-cli version ${package_version} (${expected_tag})." >&2
            exit 1
          fi

      - name: Build
        run: pnpm --filter @anvilstack/registry-cli build

      - name: Test
        run: pnpm --filter @anvilstack/registry-cli test

      - name: Stage package on npm
        working-directory: anvil-registry/apps/cli
        run: |
          extra_args=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            extra_args="--dry-run"
          fi
          npm stage publish --access public ${extra_args}

      - name: Record npm approval requirement
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        run: |
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          {
            echo "## npm approval required"
            echo
            echo "\`@anvilstack/registry-cli@${package_version}\` is staged, not yet public."
            echo "Review and approve it in npm within seven days."
          } >> "${GITHUB_STEP_SUMMARY}"
