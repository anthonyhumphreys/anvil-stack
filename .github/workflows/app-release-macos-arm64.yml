name: Anvil App Release macOS Apple Silicon

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example app-v0.1.0. Defaults to app-v<package.json version>.'
        required: false
        type: string
      notarize:
        description: 'Build signed and notarized artifacts. Requires Apple Developer ID and notary secrets.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

defaults:
  run:
    working-directory: anvil-app

jobs:
  release-macos-arm64:
    name: Build and release macOS arm64
    runs-on: macos-15

    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="app-v${package_version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            release_tag="${{ inputs.tag }}"
          else
            release_tag="${expected_tag}"
          fi

          if [[ "${release_tag}" != "${expected_tag}" ]]; then
            echo "Release tag ${release_tag} does not match package.json version ${package_version} (${expected_tag})." >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "name=Anvil ${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Build unsigned macOS Apple Silicon artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.notarize }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run dist:mac:arm64

      - name: Build signed and notarized macOS Apple Silicon artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}
        run: pnpm run dist:mac:arm64:anvil:notarized

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ steps.release.outputs.tag }}"
          release_name="${{ steps.release.outputs.name }}"
          notarized_release="${{ github.event_name == 'workflow_dispatch' && inputs.notarize }}"
          assets=(dist/*-arm64.dmg dist/*-arm64-mac.zip)
          notes_file="$(mktemp)"

          if [[ "${notarized_release}" == "true" ]]; then
            printf '%s\n' \
              'Signed and notarized macOS Apple Silicon build.' \
              > "${notes_file}"
          else
            printf '%s\n' \
              'Unsigned internal macOS Apple Silicon build.' \
              '' \
              'This build is not notarized. macOS Gatekeeper may report that the app is damaged after download. For private testing, install it and remove the quarantine attribute:' \
              '' \
              '```bash' \
              'xattr -dr com.apple.quarantine /Applications/Anvil.app' \
              '```' \
              > "${notes_file}"
          fi

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${assets[@]}" --clobber
            gh release edit "${release_tag}" --notes-file "${notes_file}"
          else
            gh release create "${release_tag}" "${assets[@]}" \
              --title "${release_name}" \
              --notes-file "${notes_file}"
          fi
