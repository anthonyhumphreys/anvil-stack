name: Anvil App Release macOS Apple Silicon

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json version. Existing tags must point to the selected workflow commit; missing tags are created there."
        required: false
        type: string
      macos_signing:
        description: "Select signed notarized output only when the anvil-production environment has Apple credentials configured."
        required: true
        type: choice
        options:
          - unsigned
          - signed-notarized
        default: unsigned

permissions:
  contents: write

concurrency:
  group: app-release-macos-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: anvil-app

jobs:
  release-macos-arm64:
    name: Build and release macOS arm64
    runs-on: macos-15
    environment: anvil-production

    env:
      GH_TOKEN: ${{ github.token }}
      ANVIL_DEPLOYMENT_ENV: production
      ANVIL_PRODUCTION_HOSTED_BACKEND_URL: ${{ vars.ANVIL_PRODUCTION_HOSTED_BACKEND_URL }}
      ANVIL_MACOS_SIGNING_MODE: ${{ inputs.macos_signing || 'unsigned' }}
      # Auto-update publication stays parked until Developer ID signing is available.
      ANVIL_UPDATE_ORIGIN: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release scope
        id: release_scope
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(
            git -C "${GITHUB_WORKSPACE}" tag --list 'app-v*' --sort=-v:refname \
              | grep -v -F -- "${current_tag}" \
              | head -n 1 || true
          )"

          if [[ -z "${previous_tag}" ]]; then
            echo "No previous app-v* tag found; allowing ${current_tag}."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_app_files="$(
            git -C "${GITHUB_WORKSPACE}" diff --name-only "${previous_tag}" "${GITHUB_SHA}" -- anvil-app \
              || true
          )"

          if [[ -n "${changed_app_files}" ]]; then
            echo "Anvil app changes found since ${previous_tag}:"
            printf '%s\n' "${changed_app_files}"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No anvil-app changes found between ${previous_tag} and ${current_tag}; skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up pnpm
        if: steps.release_scope.outputs.should_release == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        if: steps.release_scope.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-app/pnpm-lock.yaml

      - name: Resolve release tag and build commit
        if: steps.release_scope.outputs.should_release == 'true'
        id: release
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
        run: node "${GITHUB_WORKSPACE}/.github/scripts/resolve-app-release-target.mjs"

      - name: Install dependencies
        if: steps.release_scope.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS Apple Silicon artifacts
        if: steps.release_scope.outputs.should_release == 'true' && inputs.macos_signing != 'signed-notarized'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm run dist:mac:arm64

      - name: Build signed and notarized macOS Apple Silicon artifacts
        if: steps.release_scope.outputs.should_release == 'true' && inputs.macos_signing == 'signed-notarized'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run dist:mac:arm64:anvil:notarized

      - name: Prepare stable download asset
        if: steps.release_scope.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          dmg_assets=(dist/Anvil-[0-9]*-arm64.dmg)
          zip_assets=(dist/Anvil-[0-9]*-arm64-mac.zip)
          if [[ "${#dmg_assets[@]}" -ne 1 || "${#zip_assets[@]}" -ne 1 ]]; then
            echo "Expected one versioned macOS Apple Silicon DMG and ZIP, found ${#dmg_assets[@]} DMGs and ${#zip_assets[@]} ZIPs." >&2
            printf 'DMG candidates:\n' >&2
            printf '  %s\n' "${dmg_assets[@]}" >&2
            printf 'ZIP candidates:\n' >&2
            printf '  %s\n' "${zip_assets[@]}" >&2
            exit 1
          fi

          cp "${dmg_assets[0]}" dist/Anvil-latest-arm64.dmg
          (
            cd dist
            shasum -a 256 \
              "${dmg_assets[0]##*/}" \
              Anvil-latest-arm64.dmg \
              "${zip_assets[0]##*/}" \
              > Anvil-macos-arm64.sha256
          )

      - name: Create or update GitHub Release
        if: steps.release_scope.outputs.should_release == 'true'
        shell: bash
        env:
          APP_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          APP_RELEASE_NAME: ${{ steps.release.outputs.name }}
          APP_RELEASE_TAG_EXISTED: ${{ steps.release.outputs.tag_exists }}
        run: |
          set -euo pipefail

          release_tag="${APP_RELEASE_TAG}"
          release_name="${APP_RELEASE_NAME}"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          assets=(dist/Anvil-[0-9]*-arm64.dmg dist/Anvil-latest-arm64.dmg dist/*-arm64-mac.zip dist/Anvil-macos-arm64.sha256)
          notes_file="$(mktemp)"
          changelog_file="$(mktemp)"
          share_file="$(mktemp)"
          previous_tag="$(
            git -C "${GITHUB_WORKSPACE}" tag --list 'app-v*' --sort=-v:refname \
              | grep -v -F -- "${release_tag}" \
              | head -n 1 || true
          )"

          notes_args=(
            -f "tag_name=${release_tag}"
            -f "target_commitish=${GITHUB_SHA}"
          )
          if [[ -n "${previous_tag}" ]]; then
            notes_args+=(-f "previous_tag_name=${previous_tag}")
          fi

          if ! gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${notes_args[@]}" \
            --jq '.body' > "${changelog_file}"; then
            printf '%s\n' \
              "GitHub could not generate release notes automatically. Compare ${previous_tag:-the previous app release} to ${release_tag} before publishing externally." \
              > "${changelog_file}"
          fi

          if [[ "${ANVIL_MACOS_SIGNING_MODE}" == "signed-notarized" ]]; then
            printf '%s\n' \
              'Signed and notarized macOS Apple Silicon build.' \
              '' \
              'Verify the downloaded installer against Anvil-macos-arm64.sha256 before opening it.' \
              'Automatic updates remain disabled.' \
              > "${notes_file}"
          else
            printf '%s\n' \
              'Unsigned internal macOS Apple Silicon build. This build is not notarized.' \
              '' \
              'macOS Gatekeeper may block the app after download. For private testing only, verify the checksum first, install it, then remove quarantine:' \
              '' \
              '```bash' \
              'xattr -dr com.apple.quarantine /Applications/Anvil.app' \
              '```' \
              'Automatic updates remain disabled.' \
              > "${notes_file}"
          fi

          printf '\n## Changelog\n\n' >> "${notes_file}"
          cat "${changelog_file}" >> "${notes_file}"

          node "${GITHUB_WORKSPACE}/.github/scripts/create-x-release-intent.mjs" \
            "${notes_file}" \
            "${release_name}" \
            "${release_url}" \
            "${share_file}"

          printf '\n' >> "${notes_file}"
          cat "${share_file}" >> "${notes_file}"

          {
            printf '## %s\n\n' "${release_name}"
            cat "${share_file}"
          } >> "${GITHUB_STEP_SUMMARY}"

          bash "${GITHUB_WORKSPACE}/.github/scripts/ensure-app-release-target.sh" \
            "${release_tag}" \
            "${GITHUB_SHA}" \
            "${APP_RELEASE_TAG_EXISTED}" \
            "${release_name}" \
            "${notes_file}"
          gh release upload "${release_tag}" "${assets[@]}" --clobber
          gh release edit "${release_tag}" --notes-file "${notes_file}"
