name: Hosted Sync staging backend

on:
  push:
    branches: [develop, feature/sync-mesh--foundations]
    paths:
      - .github/workflows/sync-backend-staging.yml
      - anvil-app/cloud/backend/**
      - anvil-app/cloud/contract/**
      - anvil-cloud/**
  workflow_dispatch:
    inputs:
      managed_endpoint_pilot:
        description: 'Enable managed tunnels for this run in addition to the saved staging rollout setting'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sync-backend-staging
  cancel-in-progress: false

jobs:
  deploy:
    # The feature branch is allowed for the initial PR #91 rehearsal only.
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/sync-mesh--foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: anvil-staging
    defaults:
      run:
        working-directory: anvil-app/cloud/backend
    env:
      CI: true
      ANVIL_DEPLOYMENT_ENV: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            anvil-app/cloud/backend/pnpm-lock.yaml
            anvil-cloud/pnpm-lock.yaml
      - name: Install backend and deployment CLI dependencies
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm --dir ../../../anvil-cloud install --frozen-lockfile
      - name: Verify backend and deployment guards
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:hosted-deploy
          node scripts/verify-hosted-config.mjs --self-check
      - name: Build deployment CLI
        working-directory: anvil-cloud
        run: pnpm build
      - name: Generate guarded staging configuration
        id: staging_config
        env:
          ANVIL_STAGING_WORKER_VARS_JSON: ${{ vars.ANVIL_STAGING_WORKER_VARS_JSON }}
          MANAGED_ENDPOINT_PILOT: ${{ github.event_name == 'workflow_dispatch' && inputs.managed_endpoint_pilot || false }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, mkdirSync, writeFileSync, readFileSync } from 'node:fs';
          import { mergeTargetVars, validateManifest } from './scripts/hosted-deploy.mjs';
          import { stagingVars } from './scripts/staging-config.mjs';
          const manifest = JSON.parse(readFileSync('hosted-targets.ci.json', 'utf8'));
          const target = validateManifest(manifest, 'staging');
          const configured = stagingVars(
            JSON.parse(process.env.ANVIL_STAGING_WORKER_VARS_JSON || '{}'),
            { managedEndpointPilot: process.env.MANAGED_ENDPOINT_PILOT === 'true' },
          );
          appendFileSync(process.env.GITHUB_OUTPUT,
            `managed_endpoints=${configured.ANVIL_MESH_MANAGED_ENDPOINTS}\n`);
          const vars = mergeTargetVars(configured, target);
          const directory = `.wrangler/mesh/${target.workerName}`;
          mkdirSync(directory, { recursive: true });
          writeFileSync(`${directory}/vars.json`, JSON.stringify(vars), { mode: 0o600 });
          // Seed only the existing D1 identity. Planning retains this binding
          // rather than producing an unprovisioned database placeholder.
          writeFileSync(`${directory}/wrangler.jsonc`, JSON.stringify({
            name: target.workerName,
            account_id: target.accountId,
            d1_databases: [{
              binding: 'HOSTED_DB',
              database_name: target.databaseName,
              database_id: target.databaseId,
            }],
          }), { mode: 0o600 });
          JS
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json plan --json
      - name: Validate, migrate, deploy and install staging secrets
        if: steps.staging_config.outputs.managed_endpoints != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          HOSTED_SERVICE_KEYS: ${{ secrets.HOSTED_SERVICE_KEYS }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_WEBHOOK_SECRET: ${{ secrets.WORKOS_WEBHOOK_SECRET }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing CLOUDFLARE_DEPLOY_API_TOKEN'; exit 1; }
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json apply --dry-run --json
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json migrate --json
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json apply --test-deployment --json
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json secrets --json
      - name: Validate, migrate, deploy and install managed staging secrets
        if: steps.staging_config.outputs.managed_endpoints == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          HOSTED_SERVICE_KEYS: ${{ secrets.HOSTED_SERVICE_KEYS }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_WEBHOOK_SECRET: ${{ secrets.WORKOS_WEBHOOK_SECRET }}
          CLOUDFLARE_TUNNEL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ACCOUNT_ID }}
          CLOUDFLARE_TUNNEL_ZONE_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ZONE_ID }}
          CLOUDFLARE_TUNNEL_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN }}
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing CLOUDFLARE_DEPLOY_API_TOKEN'; exit 1; }
          [[ -n "$CLOUDFLARE_TUNNEL_ACCOUNT_ID" ]] || { echo 'Missing CLOUDFLARE_TUNNEL_ACCOUNT_ID'; exit 1; }
          [[ -n "$CLOUDFLARE_TUNNEL_ZONE_ID" ]] || { echo 'Missing CLOUDFLARE_TUNNEL_ZONE_ID'; exit 1; }
          [[ -n "$CLOUDFLARE_TUNNEL_API_TOKEN" ]] || { echo 'Missing CLOUDFLARE_TUNNEL_API_TOKEN'; exit 1; }
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json apply --dry-run --json
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json migrate --json
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json apply --test-deployment --json
          pnpm hosted:deploy -- --environment staging --manifest hosted-targets.ci.json secrets --json
      - name: Verify installed staging secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          MANAGED_ENDPOINTS: ${{ steps.staging_config.outputs.managed_endpoints }}
        run: |
          pnpm exec wrangler secret list --format json --config .wrangler/mesh/anvil-sync-hosted-staging/wrangler.jsonc > .wrangler/staging-secret-names.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const installed = JSON.parse(readFileSync('.wrangler/staging-secret-names.json', 'utf8'));
          const names = new Set(installed.map(secret => secret.name));
          const required = ['HOSTED_SERVICE_KEYS', 'WORKOS_API_KEY', 'WORKOS_WEBHOOK_SECRET'];
          if (process.env.MANAGED_ENDPOINTS === 'true') required.push(
            'CLOUDFLARE_TUNNEL_ACCOUNT_ID', 'CLOUDFLARE_TUNNEL_ZONE_ID', 'CLOUDFLARE_TUNNEL_API_TOKEN',
          );
          const missing = required.filter(name => !names.has(name));
          if (missing.length) throw new Error(`Required staging secrets not installed: ${missing.join(', ')}`);
          console.log(`Verified ${required.length} required staging secret names`);
          JS
      - name: Verify deployed staging identity
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://anvil-sync-hosted-staging.still-glitter-7d20.workers.dev/.well-known/anvil-backend \
            > .wrangler/staging-descriptor.json
          jq -e '
            .descriptorVersion == 1 and
            (.protocols | index("anvil-backend/1")) and
            (.profiles | index("sync/2")) and
            (.profiles | index("mesh/2")) and
            (.authModes | index("workos-device")) and
            (.authModes | index("enrollment-code") | not) and
            .auth.publicClientId == "client_01M2XPX4PF98H2P7HCNRBZATTE"
          ' .wrangler/staging-descriptor.json
      - name: Record staging deployment
        env:
          MANAGED_ENDPOINTS: ${{ steps.staging_config.outputs.managed_endpoints }}
        run: |
          printf 'Backend candidate: `%s`\n\nCheckout and Cloud Agents remain disabled. Managed endpoints: `%s`. Signed-in and physical-device acceptance is tracked in [ANV-11](https://linear.app/anvil-stack/issue/ANV-11/run-hosted-sync-staging-acceptance-for-pr-91).\n' "$GITHUB_SHA" "${MANAGED_ENDPOINTS:-false}" >> "$GITHUB_STEP_SUMMARY"
