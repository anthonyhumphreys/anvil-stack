name: Anvil Registry Images

on:
  push:
    branches:
      - main
    tags:
      - "registry-v*"
    paths:
      - ".github/workflows/registry-images.yml"
      - "anvil-registry/apps/**"
      - "anvil-registry/package.json"
      - "anvil-registry/packages/**"
      - "anvil-registry/pnpm-lock.yaml"
      - "anvil-registry/pnpm-workspace.yaml"
      - "anvil-registry/turbo.json"
      - "anvil-registry/tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: registry-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish ${{ matrix.app }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [gateway, worker, admin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anvil-registry-${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag,prefix=

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: anvil-registry
          file: anvil-registry/apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=registry-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=registry-${{ matrix.app }}
