name: Mezair Website CI

on:
  pull_request:
    paths:
      - ".github/workflows/website-ci.yml"
      - "mezair-website/**"
      - "mezair-app/cloud/contract/thread-pickup.ts"
      - "mezair-app/src/main/services/thread-share.service.ts"
      - "mezair-app/src/main/services/share-secret-scan.ts"
      - "mezair-app/src/renderer/components/chat/shared/**"
      - "mezair-app/src/renderer/components/chat/ChatEmptyState.tsx"
      - "mezair-app/src/renderer/styles/chat-theme.css"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/website-ci.yml"
      - "mezair-website/**"
      - "mezair-app/cloud/contract/thread-pickup.ts"
      - "mezair-app/src/main/services/thread-share.service.ts"
      - "mezair-app/src/main/services/share-secret-scan.ts"
      - "mezair-app/src/renderer/components/chat/shared/**"
      - "mezair-app/src/renderer/components/chat/ChatEmptyState.tsx"
      - "mezair-app/src/renderer/styles/chat-theme.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    working-directory: mezair-website

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mezair-website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test deployment environment isolation
        run: pnpm test:deployment-env

      - name: Test browser workspace credentials
        run: pnpm test:browser-workspace

      - name: Test shared thread access and pickup
        run: pnpm test:shares

      - name: Build
        run: pnpm build
