name: Anvil Website CI

on:
  pull_request:
    paths:
      - ".github/workflows/website-ci.yml"
      - "anvil-website/**"
      - "anvil-app/src/renderer/components/chat/shared/**"
      - "anvil-app/src/renderer/components/chat/ChatEmptyState.tsx"
      - "anvil-app/src/renderer/styles/chat-theme.css"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/website-ci.yml"
      - "anvil-website/**"
      - "anvil-app/src/renderer/components/chat/shared/**"
      - "anvil-app/src/renderer/components/chat/ChatEmptyState.tsx"
      - "anvil-app/src/renderer/styles/chat-theme.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    working-directory: anvil-website

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test deployment environment isolation
        run: pnpm test:deployment-env

      - name: Test browser workspace credentials
        run: pnpm test:browser-workspace

      - name: Build
        run: pnpm build
