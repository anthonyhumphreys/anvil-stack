name: Anvil App Linux x64

on:
  pull_request:
    paths:
      - ".github/workflows/app-linux-x64.yml"
      - "anvil-app/**"
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

defaults:
  run:
    working-directory: anvil-app

jobs:
  package:
    name: Build AppImage, deb, and pacman packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: anvil-app/pnpm-lock.yaml

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Package Linux x64
        run: pnpm run dist:linux:x64

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="app-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version} (${expected_tag})." >&2
            exit 1
          fi

      - name: Generate Linux checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.AppImage ./*.deb ./*.pacman > SHA256SUMS-linux-x64
          sha256sum ./*.pacman > SHA256SUMS-pacman-x64

      - name: Upload Arch Linux package
        uses: actions/upload-artifact@v4
        with:
          name: anvil-linux-x64-pacman
          if-no-files-found: error
          path: |
            anvil-app/dist/*.pacman
            anvil-app/dist/SHA256SUMS-pacman-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anvil-linux-x64
          if-no-files-found: error
          path: |
            anvil-app/dist/*.AppImage
            anvil-app/dist/*.deb
            anvil-app/dist/*.pacman
            anvil-app/dist/latest-linux.yml
            anvil-app/dist/SHA256SUMS-linux-x64

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/*.AppImage dist/*.deb dist/*.pacman dist/latest-linux.yml dist/SHA256SUMS-linux-x64)

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "Anvil ${GITHUB_REF_NAME}" \
              --generate-notes \
              || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
