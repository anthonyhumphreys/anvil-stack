appId: dev.anthonyhumphreys.anvil
productName: Anvil
copyright: AnthonyHumphreys.dev

directories:
  output: dist
  buildResources: resources

afterPack: scripts/build-apple-speech-helper.mjs

files:
  - 'out/**/*'
  - 'prompts/**/*'
  - 'scripts/**/*'
  - 'node_modules/**/*'
  - '!node_modules/**/test*'

extraResources:
  - from: resources/anvil.png
    to: anvil.png
  - from: resources/apple-foundation-models-helper.swift
    to: apple-foundation-models-helper.swift

mac:
  target: [dmg, zip]
  icon: resources/anvil.icns
  category: public.app-category.developer-tools
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSUserNotificationAlertStyle: alert
    NSMicrophoneUsageDescription: Anvil uses the microphone to turn speech into chat input.
    NSSpeechRecognitionUsageDescription: Anvil uses speech recognition to turn speech into chat input.

win:
  target: [nsis, portable]
  icon: resources/anvil.png

linux:
  target: [AppImage, deb]
  maintainer: Anthony Humphreys <contact@anthonyhumphreys.co.uk>
  icon: resources/anvil.png
  category: Development
